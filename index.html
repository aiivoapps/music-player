<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiivo Music Player</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6200ee">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-title">
                <i class="fa-solid fa-music"></i> <span>Aiivo Explorer Player</span>
            </div>
            <button id="btn-settings" class="icon-btn"><i class="fa-solid fa-gear"></i></button>
        </header>

        <main class="main-content">
            <div class="path-navigator">
                <button id="btn-back" class="icon-btn" disabled><i class="fa-solid fa-arrow-left"></i></button>
                <span id="current-path-label">Selecione a Pasta Raiz</span>
                <button id="btn-select-root" class="primary-btn"><i class="fa-solid fa-folder-open"></i> Raiz</button>
            </div>

            <div id="explorer-list" class="explorer-list">
                <div class="welcome-message">
                    <i class="fa-solid fa-folder-tree"></i>
                    <p>Toque em "Raiz" para selecionar a pasta de músicas.</p>
                </div>
            </div>
        </main>

        <div class="player-section">
            <div class="now-playing-info">
                <span id="current-song-title">Nenhuma música tocando</span>
                <button id="btn-favorite" class="icon-btn"><i class="fa-regular fa-heart"></i></button>
            </div>

            <div class="progress-container">
                <span id="time-current">00:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <span id="time-total">00:00</span>
            </div>

            <div class="player-controls-row">
                <div class="main-controls">
                    <button id="btn-prev" class="icon-btn"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="btn-play-pause" class="icon-btn primary-play"><i class="fa-solid fa-play"></i></button>
                    <button id="btn-next" class="icon-btn"><i class="fa-solid fa-forward-step"></i></button>
                </div>

                <div class="volume-control-wrapper">
                    <div id="volume-popup" class="volume-popup">
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" orient="vertical">
                    </div>
                    <button id="btn-volume-toggle" class="icon-btn"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurações</h2>
                <button id="btn-close-settings" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="settings-body">
                <div class="setting-group">
                    <button id="btn-filter-favorites" class="secondary-btn"><i class="fa-solid fa-heart"></i> Ver Favoritos</button>
                </div>
                <div class="setting-group">
                    <label>Personalização</label>
                    <div class="color-pickers">
                        <div><span>Principal</span><input type="color" id="color-primary" value="#6200ee"></div>
                        <div><span>Fundo</span><input type="color" id="color-bg" value="#121212"></div>
                        <div><span>Texto</span><input type="color" id="color-text" value="#ffffff"></div>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Efeitos de Áudio</label>
                    <select id="audio-effect-select" class="styled-select">
                        <option value="normal">Normal</option>
                        <option value="3d">Áudio 3D</option>
                        <option value="8d">Áudio 8D</option>
                        <option value="16d">Áudio 16D</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
