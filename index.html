<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Player de música com navegação em pastas, efeitos 3D/8D/16D e personalização completa">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Explorer Music Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button id="btn-select-root" class="btn-icon" title="Selecionar pasta raiz">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        </button>
        <h1 class="app-title">Explorer Music</h1>
      </div>
      <div class="header-right">
        <button id="btn-favorites-filter" class="btn-icon" title="Filtrar favoritos">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="Configurações">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </header>

    <!-- Root path bar -->
    <div id="root-path-bar" class="root-path-bar hidden">
      <span id="root-path-text">Nenhuma pasta selecionada</span>
      <button id="btn-refresh" class="btn-icon small" title="Atualizar árvore">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>

    <!-- Main area: Tree + Volume -->
    <main class="main-content">
      <div class="tree-container">
        <div id="tree-view" class="tree-view">
          <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24" width="64" height="64" opacity="0.4"><path fill="currentColor" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            <p>Selecione uma pasta raiz para começar</p>
            <button id="btn-select-root-empty" class="btn-primary">Escolher Pasta</button>
          </div>
        </div>
      </div>

      <!-- Vertical Volume Panel -->
      <div class="volume-panel" id="volume-panel">
        <div class="volume-slider-wrap">
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80" orient="vertical">
          <div class="volume-value" id="volume-value">80%</div>
        </div>
        <button id="btn-volume-toggle" class="btn-volume-toggle" title="Mute / Unmute">
          <svg id="icon-volume" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <div class="volume-width-control">
          <label>Largura</label>
          <input type="range" id="volume-width" min="28" max="56" value="40">
        </div>
      </div>
    </main>

    <!-- Now Playing / Player Controls -->
    <footer class="player-bar" id="player-bar">
      <div class="now-playing">
        <div class="track-info">
          <div class="track-title" id="track-title">Nenhuma faixa</div>
          <div class="track-path" id="track-path">—</div>
        </div>
        <button id="btn-favorite" class="btn-icon" title="Favoritar" disabled>
          <svg id="icon-fav" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
        </button>
      </div>

      <div class="progress-area">
        <span id="time-current">0:00</span>
        <input type="range" id="progress-slider" class="progress-slider" min="0" max="1000" value="0">
        <span id="time-total">0:00</span>
      </div>

      <div class="controls">
        <button id="btn-shuffle" class="btn-icon" title="Aleatório">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="btn-prev" class="btn-icon" title="Anterior">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="btn-play" title="Play / Pause">
          <svg id="icon-play" viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-next" class="btn-icon" title="Próxima">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-repeat" class="btn-icon" title="Repetir">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>

      <div class="extra-controls">
        <div class="effect-badge" id="effect-badge">Normal</div>
        <button id="btn-queue-mode" class="btn-text" title="Modo de fila">Pasta</button>
      </div>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Configurações</h2>
        <button id="btn-close-settings" class="btn-icon">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <section class="settings-section">
          <h3>Cores da Interface</h3>
          <div class="color-grid">
            <label>Fundo principal <input type="color" id="color-bg" value="#0f0f13"></label>
            <label>Fundo secundário <input type="color" id="color-bg2" value="#1a1a22"></label>
            <label>Texto principal <input type="color" id="color-text" value="#e8e8ed"></label>
            <label>Texto secundário <input type="color" id="color-text2" value="#9a9aa8"></label>
            <label>Destaque / Accent <input type="color" id="color-accent" value="#7c5cff"></label>
            <label>Player bar <input type="color" id="color-player" value="#16161e"></label>
            <label>Árvore / Cards <input type="color" id="color-tree" value="#1e1e28"></label>
            <label>Borda / Divisor <input type="color" id="color-border" value="#2a2a36"></label>
            <label>Botão play <input type="color" id="color-play" value="#7c5cff"></label>
            <label>Favorito ativo <input type="color" id="color-fav" value="#ff5c8a"></label>
            <label>Volume panel <input type="color" id="color-vol" value="#1a1a22"></label>
            <label>Progresso <input type="color" id="color-progress" value="#7c5cff"></label>
          </div>
          <button id="btn-reset-colors" class="btn-secondary">Restaurar cores padrão</button>
        </section>

        <section class="settings-section">
          <h3>Efeitos de Áudio Espacial</h3>
          <div class="effect-options">
            <label class="radio-card">
              <input type="radio" name="audio-effect" value="normal" checked>
              <span class="radio-label">Normal</span>
              <span class="radio-desc">Áudio estéreo padrão</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="audio-effect" value="3d">
              <span class="radio-label">3D</span>
              <span class="radio-desc">Espacialização suave</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="audio-effect" value="8d">
              <span class="radio-label">8D</span>
              <span class="radio-desc">Movimento circular</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="audio-effect" value="16d">
              <span class="radio-label">16D</span>
              <span class="radio-desc">Movimento intenso + eco</span>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>Comportamento</h3>
          <label class="switch-label">
            <input type="checkbox" id="opt-auto-play-next" checked>
            <span>Tocar próxima automaticamente</span>
          </label>
          <label class="switch-label">
            <input type="checkbox" id="opt-remember-position" checked>
            <span>Lembrar posição da faixa</span>
          </label>
          <label class="switch-label">
            <input type="checkbox" id="opt-show-hidden">
            <span>Mostrar arquivos ocultos</span>
          </label>
        </section>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>
  <input type="file" id="folder-input" webkitdirectory multiple accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.opus,.webm" style="display:none">
  <script src="app.js"></script>
</body>
</html>
